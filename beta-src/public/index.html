<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="webDiplomacy is an online, multiplayer, turn-based strategy game that lets you play Diplomacy online." />
		<meta name="keywords" content="diplomacy,diplomacy game,online diplomacy,classic diplomacy,web diplomacy,diplomacy board game,play diplomacy,php diplomacy" />
		
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>webDiplomacy Game Map</title>
    <!-- Google tag (gtag.js). The build takes the measurement IDs from config.php, the tag the PHP pages use
      (scripts/ga-measurement-id.php), so the beta reports to the same GA property as the rest of its site.
      A build without an ID, e.g. in development, still defines gtag() but loads and sends nothing. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

      (function () {
        // The PHP pages use Config::isOnPlayNowDomain(); the play-now domain is play.webdiplomacy.net
        var site = /^play\./.test(location.hostname) ? "play" : "main";
        var gaId = site === "play" ? "%REACT_APP_GA_ID_PLAY%" : "%REACT_APP_GA_ID_MAIN%";
        if (!/^G-[A-Z0-9]+$/.test(gaId)) return;

        var tag = document.createElement("script");
        tag.async = true;
        tag.src = "https://www.googletagmanager.com/gtag/js?id=" + gaId;
        document.head.appendChild(tag);

        gtag('js', new Date());

        // The same logged_in / user_type user properties the PHP pages send (see libHTML::analyticsUserProperties).
        // This page is static, so being logged on is judged by the wD-Key cookie, and the type is the one the last
        // PHP page stored.
        var loggedIn = /(^|;\s*)wD-Key=/.test(document.cookie);
        var userType = "guest";
        if (loggedIn) {
          try { userType = localStorage.getItem("wD-userType") || "user"; } catch (e) { userType = "user"; }
          if (userType === "guest") userType = "user";
        }
        gtag('set', 'user_properties', { logged_in: loggedIn ? "yes" : "no", user_type: userType });
        gtag('set', { site: site });

        gtag('config', gaId);
      })();
    </script>
    <!-- Google AdSense - External script for easy modification.
      ?ver= is stamped by the build script with a hash of adsense.js, so cached copies
      are refreshed automatically whenever the file changes. -->
    <script defer src="%PUBLIC_URL%/../javascript/adsense.js?ver=%REACT_APP_ADSENSE_VER%"></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

  </body>
</html>
