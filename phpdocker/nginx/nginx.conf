server {
    listen 80 default;

    client_max_body_size 108M;

    access_log /var/log/nginx/application.access.log;

    proxy_connect_timeout       300;
    proxy_send_timeout          300;
    proxy_read_timeout          300;
    send_timeout                300;

    # Redirects keep the port the request came in on, which the published 43000 isn't inside here
    absolute_redirect off;

    # The React board moved from /beta/ to /game/ on 2026-09-20; the old build may still be on disk
    location ^~ /beta {
        rewrite ^/beta/?(.*)$ /game/$1 redirect;
    }

    # Proxy pass for SSE
    location /events {
      proxy_pass http://sse:43006;    proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
  
      proxy_buffering off;
      chunked_transfer_encoding off;
  
      # Keep the connection alive for SSE
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      send_timeout 3600s;
    }

    root /application/.;
    index index.php index.html;

    # try to serve file directly, fallback to index.php
    # actually don't as missing json files instead return HTML
    #location / {
    #    try_files $uri =404; #/index.php$is_args$args;
    #}
    location ~* (\.env|gamebackups|errorlogs) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # nginx doesn't read the .htaccess files that hide these on the live site, so /.git/config and
    # the rest of the dot files are served from the document root without this
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.php(/|$) {
        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.*)$; # Needed for app.php/postlove/toggle/123
        # Only hand php-fpm scripts that exist: a request for /cache/games/1/2/game.json/x.php
        # otherwise reaches PHP with a SCRIPT_FILENAME that isn't there, which is how an uploaded
        # file ends up being executed. try_files clears $fastcgi_path_info, hence the copy.
        set $path_info $fastcgi_path_info;
        try_files $fastcgi_script_name =404;
        fastcgi_param PATH_INFO $path_info;
	    fastcgi_param PHP_SELF $fastcgi_script_name;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PHP_VALUE "error_log=/var/log/nginx/application_php_errors.log";
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        include fastcgi_params;
    }
}
