upload_max_filesize = 100M
post_max_size = 108M
memory_limit = 200M
display_errors = On
max_execution_time = 600

# Windows
#xdebug.mode = debug
#xdebug.remote_host = host.docker.internal
#xdebug.start_with_request = no
#xdebug.connect_timeout_ms = 100
#xdebug.discover_client_host = 1

# Linux
xdebug.mode = debug
#xdebug.remote_connect_back = true
# Only attach when asked to: a browser extension's XDEBUG_TRIGGER cookie, ?XDEBUG_TRIGGER=1, or the
# XDEBUG_SESSION variable in docker-compose.yml, which covers command line scripts too. With "yes"
# every request and every CLI script tries to reach the IDE, and prints a warning when nothing is
# listening, which ends up in the output of anything that shells out to php.
xdebug.start_with_request = trigger
xdebug.idekey = VSCODE
xdebug.client_host = 172.17.0.1
xdebug.client_port = 9003