###############################################################################
#                          Generated on phpdocker.io                          #
#
# The webDiplomacy development stack. From a fresh checkout, with nothing installed on the host but
# docker:
#
#   docker compose --profile core up -d                       # the site
#   docker compose --profile dev up -d                        # and mailhog and phpmyadmin
#   docker compose --profile build up beta-build game-build    # build /beta/ and /game/, then exit
#
# (or right click this file in VS Code and select Compose Up - Select services)
#
# php-fpm's entrypoint, install/gamemaster-entrypoint.sh, does the setting up: composer install for
# the PHP dependencies, config.php from config.sample.php with an SSE secret generated into it and
# into sse-server/.env, and install/FullInstall/fullInstall.sql into an empty database. It then runs
# the gamemaster every three seconds. Watch it with
#
#   docker compose logs -f php-fpm
#
# (the same output is at http://localhost:43000/gamemaster-entrypoint.txt) and wait for READY; the
# first run takes a few minutes, most of it the database. If the database is ever emptied or its
# container recreated, the entrypoint notices within a minute and installs it again.
#
# Nothing here is precious: the database lives in its container with no volume behind it, and
# everything else is in git or rebuilt on startup. To start over:
#
#   docker compose --profile core --profile dev down && docker compose --profile core up -d
#
# Ports, all bound to localhost (see the comment on mariadb below):
#   43000 the site   43001 mailhog   43003 mariadb   43005 redis   43006 sse   43009 phpmyadmin
#
# The 'reactdev' profile runs the beta React development server with hot reload instead of a build.
#
# The containers that write into the checkout run as uid 1000; if that isn't you, put DOCKER_UID and
# DOCKER_GID in a .env file beside this one.
#
# Register a user account via http://localhost:43000/register.php, using any e-mail address
# then use http://localhost:43001 / mailhog to access the registration link.
# Taking the registration link code and adding it to your webserver should give e.g.:
# (If using the config.sample.php defaults you can use the link below directly:)
# http://localhost:43000/register.php?emailToken=9513e6f6%7C1665482821%7Ctest%40test.com
# Complete filling the registration form, then once logged on:
# Go to http://localhost:43000/gamemaster.php?gameMasterSecret= to set self as admin
# Go to http://localhost:43000/admincp.php?tab=Control%20Panel&actionName=maintenance#maintenance to enable maintenance mode
# Go to http://localhost:43000/admincp.php?actionName=wipeVariants#wipeVariants to clear variant data
# Go to http://localhost:43000/admincp.php?actionName=updateVariantInfo&variantID=#updateVariantInfo to regenerate variant data
# Go to http://localhost:43000/datc.php?testID=101&batchTest=12345 to run through the DATC test cases
# Go to http://localhost:43000/admincp.php?tab=Control%20Panel&actionName=maintenance#maintenance to disable maintenance mode
# 
# If docker is running in hyper-V mode on Windows you may need to enable developer mode so that symlinks work for non-admins,
# in order for npm to work over the hyper-V fileshare.
# 
# Server is ready for dev work
#
# If config.php isn't changed you can use these links below to quickly register 7 users:
# http://localhost:43000/logon.php?logoff=on
# http://localhost:43000/register.php?emailToken=9513e6f6%7C1665482821%7Ctest%40test.com
# http://localhost:43000/logon.php?logoff=on
# http://localhost:43000/register.php?emailToken=b3aa9320%7C1665483920%7Ctest2%40test.com
# http://localhost:43000/logon.php?logoff=on
# http://localhost:43000/register.php?emailToken=8749c175%7C1665483937%7Ctest3%40test.com
# http://localhost:43000/logon.php?logoff=on
# http://localhost:43000/register.php?emailToken=d9da3907%7C1665483948%7Ctest4%40test.com
# http://localhost:43000/logon.php?logoff=on
# http://localhost:43000/register.php?emailToken=f62e0ff3%7C1665483960%7Ctest5%40test.com
# http://localhost:43000/logon.php?logoff=on
# http://localhost:43000/register.php?emailToken=d63245b5%7C1665483971%7Ctest6%40test.com
# http://localhost:43000/logon.php?logoff=on
# http://localhost:43000/register.php?emailToken=e2c45b63%7C1665483982%7Ctest7%40test.com
#
# The default no-press bots are no longer started from this file; see the note at the end of it.
#
###############################################################################
#Linux set in php-overrides.ini
# ufw allow from 172.17.0.0/12 to any port 9003 proto tcp comment 'Allow Xdebug from Docker subnet'
#XDEBUG_CONFIG: client_host=host.docker.internal client_port=9003 #Windows/Max
#ERROR 1130 (HY000): Host '172.18.0.8' is not allowed to connect to this MariaDB server
#GRANT ALL PRIVILEGES ON webdiplomacy.* TO 'webdiplomacy'@'%' IDENTIFIED BY 'mypassword123';
#FLUSH PRIVILEGES;
#CREATE DATABASE webdiplomacy;

services:
  mariadb:
    profiles: ["core"]
    image: "mariadb:10.6"
    container_name: "webdiplomacy-db"
    restart: always
    working_dir: /application
    environment:
      - MYSQL_ROOT_PASSWORD=mypassword123
      - MYSQL_DATABASE=webdiplomacy
      - MYSQL_USER=webdiplomacy
      - MYSQL_PASSWORD=mypassword123
    volumes:
      - "./:/application"
    # The database lives in the container, with no volume behind it, so deleting this container
    # throws the dev database away and the next start installs a fresh one. php-fpm notices an
    # empty database within a minute and reinstalls, so this container can be recreated alone.
    #
    # Published ports are bound to localhost throughout this file. Docker's firewall rules sit in
    # front of ufw's, so "43003:3306" really does offer this database, whose password is written
    # above, to every machine on the network. The containers reach each other by service name on
    # the compose network and don't go through these ports.
    ports:
      - "127.0.0.1:43003:3306"
    # Default buffer pool is 128MB, which makes large dump imports do a random
    # disk read per row once an index outgrows it. 4G holds the working set.
    # This may not be necessary on small installations (e.g. a fresh install
    # without a large dump imported); remove it or lower it if RAM is limited.
    command:
      - --innodb-buffer-pool-size=4G

  webserver:
    profiles: ["core"]
    image: "nginx:1.27-alpine"
    working_dir: /application
    volumes:
      - "./:/application"
      - "./phpdocker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf"
    # Drop the 127.0.0.1 to open the dev site to the network, e.g. to try it on a phone. It has no
    # real data, but it does hand out an admin account to anyone who asks for gamemaster.php.
    ports:
      - "127.0.0.1:43000:80"
    depends_on:
      - "php-fpm"

  sse:
    profiles: ["core"]
    # node 18 or newer: the server uses express 5 and node-redis 5
    image: "node:20-alpine"
    container_name: webdiplomacy-sse
    restart: unless-stopped
    # As the host user, so the node_modules it installs into sse-server/ aren't left owned by root
    # (DOCKER_UID/DOCKER_GID, as for the build services below)
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    environment:
      - HOME=/tmp
    working_dir: /application
    volumes:
      - "./sse-server:/application"
    ports:
      - "127.0.0.1:43006:43006"
    # Neither node_modules nor .env is in git: install the first from package-lock.json, and wait
    # for the second, which php-fpm's entrypoint writes with the SSE secret it finds in (or
    # generates for) config.php.
    command: >
      sh -c "npm ci --no-audit --no-fund --loglevel=error &&
             while [ ! -f .env ]; do echo 'Waiting for php-fpm to write sse-server/.env'; sleep 2; done &&
             node server.js"
    depends_on:
      - "redis"

  redis:
    profiles: ["core"]
    image: "redis:7-alpine"
    container_name: webdiplomacy-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:43005:6379"

  php-fpm:
    profiles: ["core"]
    command: /bin/sh -c "install/gamemaster-entrypoint.sh > /application/gamemaster-entrypoint.txt"
    build: phpdocker/php-fpm
    working_dir: /application
    environment: 
      - PHP_IDE_CONFIG="serverName=Docker"
      - XDEBUG_CONFIG=client_host=172.17.0.1 client_port=9003
      - XDEBUG_MODE=debug
      # Xdebug only attaches when something asks it to (php-ini-overrides.ini sets
      # xdebug.start_with_request=trigger): a browser extension's XDEBUG_TRIGGER cookie, ?XDEBUG_TRIGGER=1,
      # or this variable, which covers the command line too. Uncommented, every request and every CLI
      # script tries to reach the IDE and prints a warning when nothing is listening.
      #- XDEBUG_SESSION=1
    volumes:
      - "./:/application"
      - "./phpdocker/php-fpm/php-ini-overrides.ini:/etc/php/8.4/fpm/conf.d/99-overrides.ini"
    depends_on:
      - "mariadb"

  mailhog:
    profiles: ["dev"]
    image: "mailhog/mailhog:v1.0.1"
    ports:
      - "127.0.0.1:43001:8025"

  phpmyadmin:
    profiles: ["dev"]
    image: "phpmyadmin:5"
    # PMA_ARBITRARY let it connect to any host given on the login form, which is a proxy into the
    # network for anyone who reaches it; it only ever needs the dev database
    environment:
      - PMA_HOST=webdiplomacy-db
      - PMA_PORT=3306
    ports:
      - "127.0.0.1:43009:80"
    depends_on:
      - "mariadb"

# Build the two React boards, which aren't in git and so are missing from a fresh checkout:
# beta-src to /beta/ and game-src to /game/. Both run once and exit:
#   docker compose --profile build up beta-build game-build
# They build as the host user (override with DOCKER_UID/DOCKER_GID) so the output and node_modules
# aren't left owned by root. The builds call php for the Google Analytics ID and there is no php
# here, so a dev build loads no analytics, which is what a dev build wants.
  beta-build:
    profiles: ["build"]
    image: "node:20-alpine"
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    working_dir: /application/beta-src
    environment:
      - HOME=/tmp
    volumes:
      - "./:/application"
    command: sh -c "npm ci --no-audit --no-fund && npm run build"

  game-build:
    profiles: ["build"]
    image: "node:20-alpine"
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    working_dir: /application/game-src
    environment:
      - HOME=/tmp
    volumes:
      - "./:/application"
    command: sh -c "npm ci --no-audit --no-fund && npm run build"

# This is necessary for doing live React dev for the new board, but isn't needed after doing a build,
# and needs the /beta proxy in phpdocker/nginx/nginx.conf uncommented.
  beta:
    profiles: ["reactdev"]
    image: "node:20-alpine"
    container_name: webdiplomacy-beta
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
    working_dir: /application
    environment:
      - HOME=/tmp
    volumes:
      - "./beta-src:/application"
    ports:
      - "127.0.0.1:3000:3000"
    command: >
      sh -c "npm install --no-audit --no-fund && npm run start || (while true; do sleep 1; done)"

# The no-press (gunboat) bots, Philip Paquette's DipNet models, used to run here from the
# webdiplomacy/gunboatbots image. Its base image has since been taken down, so the bots now live in
# their own checkout, webdiplomacy_bots_mila, which unpacks everything they need and builds on a
# stock Ubuntu 18.04 image; its README covers setup. To run them against this dev stack, from that
# checkout's docker/ directory:
#   docker compose -f compose.yml -f compose.dev.yml up -d
# That joins this project's network (webdiplomacy_default) and calls http://webserver/api.php with
# the API keys bot1 to bot7, as the bots service here did.
